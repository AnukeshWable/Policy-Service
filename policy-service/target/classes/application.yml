server:
  port: 8082

spring:
  application:
    name: policy-service
  datasource:
    url: jdbc:mysql://localhost:3306/policy_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Externalized so Docker/Kubernetes can override it later (e.g. CUSTOMER_SERVICE_BASE_URL)
customer-service:
  base-url: ${CUSTOMER_SERVICE_BASE_URL:http://localhost:8081}
  connect-timeout-ms: 2000
  read-timeout-ms: 3000
